<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL POLLO LOCO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./img/3_enemies_chicken/chicken_normal/1_walk/3_w.png">
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/start-screen.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/coin-bar.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/bottle-bar.class.js"></script>
    <script src="./models/boss-bar.class.js"></script>
    <script src="./models/salsa-bottle.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js"></script>
</head>
<body>
    <h1>Welcome to EL POLLO LOCO!</h1>
    <div class="canvas-container" id="canvas-container">
        <canvas id="canvas" width="720px" height="480px"></canvas>
        <div class="overlay-screen" id="overlay-screen">
            <div class="start-screen" id="start-screen">
                <img src="./img/9_intro_outro_screens/start/startscreen_1.png" alt="Start Screen">
                <button onclick="startGame()">Start Game</button>
            </div>
            <div class="game-over-screen dp_none" id="game-over-screen">
                <img src="./img/9_intro_outro_screens/game_over/game over!.png" alt="Game Over Screen">
                <button onclick="restartGame()">Restart Game</button>
            </div>
            <div class="win-screen dp_none" id="win-screen">
                <img src="img/You won, you lost/You won A.png" alt="Win Screen">
                <button onclick="restartGameWin()">Play Again</button>
            </div>
            <button class="fullscreen-button" onclick="toggleFullscreen()"> <img src="./img/fullscreen.png" alt="fullscreen"></button>
        </div>
    </div>
    <div class="controlls">
        <p>Move: Arrow Keys</p>
        <p>Jump: Spacebar</p>
        <p>Throw bottle: D</p>
    </div>
</body>
</html>
